<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Stickman Launch Physics</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#101c2c"><meta name="apple-mobile-web-app-title" content="Stickman Launch"><link rel="apple-touch-icon" href="./icon-192.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111a2b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100dvh}.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);display:flex;align-items:center;justify-content:space-between;pointer-events:none;gap:8px}.title{font-weight:900;font-size:clamp(12px,2.4vw,19px);text-shadow:0 2px 8px #000}.tools{display:flex;gap:7px;pointer-events:auto}button{color:white;font-weight:800;border:1px solid #8b9bb3;background:#273950;border-radius:12px;padding:9px 12px;touch-action:none}.controls{position:fixed;inset:0;pointer-events:none}.joy{position:absolute;left:max(4%,env(safe-area-inset-left));bottom:calc(6% + env(safe-area-inset-bottom));width:min(30vh,160px);height:min(30vh,160px);border:3px solid #ffffff7c;border-radius:50%;background:#ffffff1a;pointer-events:auto;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:43%;height:43%;border-radius:50%;background:#66d6ffb9;border:3px solid white;transform:translate(-50%,-50%);box-shadow:0 0 20px #4ac9ff55}.launch{position:absolute;right:max(5%,env(safe-area-inset-right));bottom:calc(10% + env(safe-area-inset-bottom));width:min(32vh,166px);height:min(32vh,166px);border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffad58,#e3482c);border:4px solid #ffd8a6;box-shadow:0 0 26px #ff632a70;pointer-events:auto;touch-action:none;font-size:clamp(14px,3.5vh,23px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}.launch small{font-size:11px}.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;color:#d2e0f0;text-align:center;font-size:11px;pointer-events:none;white-space:nowrap;text-shadow:0 1px 3px black}.portrait{display:none;position:fixed;inset:0;z-index:10;background:#0b1424d9;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:22px;font-weight:800}@media (orientation:portrait){.portrait{display:flex}}@media (max-height:370px){.hint{display:none}.joy{bottom:4%}.launch{bottom:6%}}</style></head><body><canvas id="game"></canvas><div class="top"><div class="title">⚡ STICKMAN LAUNCH <span id="score">0 hits</span></div><div class="tools"><button id="tilt">📱 Kantelen: UIT</button><button id="reset">↻ Reset</button></div></div><div class="controls"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><button id="launch" class="launch">🚀<span>LANCEER</span><small>richt met joystick</small></button></div><div class="hint">Linker joystick = richting • rechter knop = lanceer • raak de rode pop!</div><div class="portrait">📱 ↻<br>Houd je telefoon horizontaal om te spelen!</div><script>
(()=>{'use strict';const cv=document.querySelector('#game'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,ground=0,cam=0,hits=0,shake=0,tiltEnabled=false,tiltG=0;const score=document.querySelector('#score');function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H-36}addEventListener('resize',resize);resize();const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let ax=0,ay=-1,active=false,joyId=null;function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.36;let x=(e.clientX-cx)/max,y=(e.clientY-cy)/max,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}if(Math.hypot(x,y)>.12){ax=x;ay=y}stick.style.left=(50+x*36)+'%';stick.style.top=(50+y*36)+'%'}joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(e.pointerId);active=true;setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});function end(e){if(e.pointerId!==joyId)return;active=false;joyId=null;stick.style.left='50%';stick.style.top='50%'}joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
const nodes=[],links=[];function add(x,y){nodes.push({x,y,px:x,py:y,r:5});return nodes.length-1}function link(a,b,stiff=1){const A=nodes[a],B=nodes[b];links.push({a,b,d:Math.hypot(A.x-B.x,A.y-B.y),stiff})}let pelvis,chest,head,lh,rh,le,re,lf,rf,ls,rs;function makeDoll(x,y){nodes.length=0;links.length=0;pelvis=add(x,y);chest=add(x,y-30);head=add(x,y-66);ls=add(x-12,y-31);rs=add(x+12,y-31);lh=add(x-30,y-4);rh=add(x+30,y-4);le=add(x-13,y+31);re=add(x+13,y+31);lf=add(x-18,y+65);rf=add(x+18,y+65);[[pelvis,chest],[chest,head],[chest,ls],[chest,rs],[ls,lh],[rs,rh],[pelvis,le],[pelvis,re],[le,lf],[re,rf],[ls,rs],[ls,pelvis],[rs,pelvis],[le,re]].forEach(p=>link(...p));}makeDoll(145,ground-95);let enemy={x:680,y:ground-65,vx:0,vy:0,fallen:0},particles=[];function reset(){makeDoll(145,ground-95);enemy={x:680,y:ground-65,vx:0,vy:0,fallen:0};cam=0;hits=0;score.textContent='0 hits'}document.querySelector('#reset').addEventListener('click',reset);let cooldown=0;function launch(){if(cooldown>0)return;cooldown=.18;let x=ax,y=ay,l=Math.hypot(x,y)||1;x/=l;y/=l;const force=17;for(const n of nodes){n.px=n.x-x*force;n.py=n.y-y*force}shake=5;for(let i=0;i<15;i++)particles.push({x:nodes[pelvis].x,y:nodes[pelvis].y,vx:(Math.random()-.5)*5-x*2,vy:(Math.random()-.5)*5-y*2,life:1})}const launchButton=document.querySelector('#launch');launchButton.addEventListener('pointerdown',e=>{e.preventDefault();launch()});addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();launch()}if(e.key==='ArrowLeft'){ax=-1;ay=0}if(e.key==='ArrowRight'){ax=1;ay=0}if(e.key==='ArrowUp'){ax=0;ay=-1}});document.querySelector('#tilt').addEventListener('click',async()=>{if(!tiltEnabled){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted')return}}catch(e){alert('Kantelsensor niet beschikbaar in deze browser');return}}tiltEnabled=!tiltEnabled;document.querySelector('#tilt').textContent='📱 Kantelen: '+(tiltEnabled?'AAN':'UIT')});addEventListener('deviceorientation',e=>{if(tiltEnabled&&e.gamma!=null)tiltG=Math.max(-.22,Math.min(.22,e.gamma/120))});function update(){cooldown=Math.max(0,cooldown-1/60);shake*=.88;const gravity=.38;for(const n of nodes){let vx=(n.x-n.px)*.993,vy=(n.y-n.py)*.993;n.px=n.x;n.py=n.y;n.x+=vx+tiltG;n.y+=vy+gravity;if(n.y>ground-n.r){n.y=ground-n.r;n.py=n.y+vy*.35;n.px=n.x-vx*.76}if(n.x<10){n.x=10;n.px=n.x+vx*.5}}for(let k=0;k<9;k++){for(const c of links){let a=nodes[c.a],b=nodes[c.b],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,cor=(dist-c.d)/dist*.5*c.stiff;a.x+=dx*cor;a.y+=dy*cor;b.x-=dx*cor;b.y-=dy*cor}for(const n of nodes){if(n.y>ground-n.r)n.y=ground-n.r}}enemy.vy+=gravity;enemy.x+=enemy.vx;enemy.y+=enemy.vy;enemy.vx*=.992;if(enemy.y>ground-25){enemy.y=ground-25;enemy.vy*=-.2;enemy.vx*=.87}for(const n of nodes){let dx=n.x-enemy.x,dy=n.y-(enemy.y-25),dist=Math.hypot(dx,dy);if(dist<34){let impact=Math.hypot(n.x-n.px,n.y-n.py);if(impact>2.4&&enemy.fallen<=0){hits++;score.textContent=hits+' hits';enemy.fallen=60;shake=10;enemy.vx=dx>0?-8:8;enemy.vy=-9;for(let i=0;i<16;i++)particles.push({x:enemy.x,y:enemy.y-25,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1})}}}enemy.fallen=Math.max(0,enemy.fallen-1);if(enemy.x<nodes[pelvis].x+340&&enemy.x<nodes[pelvis].x-200)enemy.x=nodes[pelvis].x+650;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.03}for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);cam+=(Math.max(0,nodes[pelvis].x-W*.35)-cam)*.07}function line(a,b,color='#f2f7ff',width=9){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function render(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b3152');bg.addColorStop(1,'#121a2c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam+(Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.strokeStyle='#314762';ctx.lineWidth=1;for(let x=Math.floor(cam/70)*70;x<cam+W+70;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ground);ctx.stroke()}ctx.fillStyle='#38516b';ctx.fillRect(cam-100,ground,W+300,36);ctx.fillStyle='#6b91ae';ctx.fillRect(cam-100,ground,W+300,5);for(let x=300;x<cam+W+400;x+=410){ctx.fillStyle='#314a67';ctx.fillRect(x,ground-24,18,24)}ctx.fillStyle='#fa5e63';ctx.strokeStyle='#a9293e';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(enemy.x,enemy.y-38);ctx.lineTo(enemy.x,enemy.y-10);ctx.moveTo(enemy.x,enemy.y-27);ctx.lineTo(enemy.x-17,enemy.y-8);ctx.moveTo(enemy.x,enemy.y-27);ctx.lineTo(enemy.x+17,enemy.y-8);ctx.moveTo(enemy.x,enemy.y-10);ctx.lineTo(enemy.x-13,enemy.y+13);ctx.moveTo(enemy.x,enemy.y-10);ctx.lineTo(enemy.x+13,enemy.y+13);ctx.stroke();ctx.beginPath();ctx.arc(enemy.x,enemy.y-52,12,0,Math.PI*2);ctx.fill();const pairs=[[pelvis,chest],[chest,ls],[chest,rs],[ls,lh],[rs,rh],[pelvis,le],[pelvis,re],[le,lf],[re,rf]];for(const [a,b] of pairs)line(nodes[a],nodes[b],'#d9f5ff',9);ctx.fillStyle='#f1fcff';ctx.beginPath();ctx.arc(nodes[head].x,nodes[head].y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1c3448';ctx.beginPath();ctx.arc(nodes[head].x+5,nodes[head].y-2,2.7,0,Math.PI*2);ctx.fill();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffcf6b';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;let px=nodes[pelvis].x,py=nodes[pelvis].y;let x=ax,y=ay,l=Math.hypot(x,y)||1;x/=l;y/=l;ctx.strokeStyle='#6ce5ff';ctx.lineWidth=4;ctx.setLineDash([9,8]);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+x*110,py+y*110);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#6ce5ff';ctx.beginPath();ctx.moveTo(px+x*110,py+y*110);ctx.lineTo(px+x*95-y*8,py+y*95+x*8);ctx.lineTo(px+x*95+y*8,py+y*95-x*8);ctx.closePath();ctx.fill();ctx.restore()}let last=performance.now(),acc=0;function frame(t){acc+=Math.min(.05,(t-last)/1000);last=t;let count=0;while(acc>=1/60&&count++<4){update();acc-=1/60}render();requestAnimationFrame(frame)}requestAnimationFrame(frame);})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){let b=document.createElement('button');b.textContent='Nieuwe versie beschikbaar — bijwerken';b.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;background:#00b4d8;color:#00121a;border:0;border-radius:12px;padding:12px;font-weight:bold';b.onclick=()=>w.postMessage({type:'SKIP_WAITING'});document.body.appendChild(b)}})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}).catch(()=>{}))}</script></body></html>
